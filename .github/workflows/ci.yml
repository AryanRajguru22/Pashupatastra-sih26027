name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pypdf
      # Tests use their own temporary database unless PASHUPAT_JOBS_DB is set.
      - run: python -m pytest -q
      - name: Demo rehearsal (plan, then disrupt and recover), synthetic mode
        env:
          PASHUPAT_CORRIDOR_ID: CORR-NDLS-AGC
          PASHUPAT_JOBS_DB: ${{ runner.temp }}/demo/jobs.db
        run: python scripts/seed_demo.py --verify
      - name: Demo rehearsal, real public-data snapshot mode
        env:
          PASHUPAT_CORRIDOR_ID: CORR-NDLS-AGC
          PASHUPAT_RAILWAY_DATA: real
          PASHUPAT_JOBS_DB: ${{ runner.temp }}/demo/jobs.db
        run: python scripts/seed_demo.py --verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
